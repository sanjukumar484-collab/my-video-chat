<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Random Video Chat</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>Random Video Chat</h1>

    <div class="videos">

        <div class="video-box">
            <video id="remoteVideo" autoplay playsinline></video>
            <span>Stranger</span>
        </div>

        <div class="video-box small">
            <video id="localVideo" autoplay muted playsinline></video>
            <span>You</span>
        </div>

    </div>

    <div id="status">
        Click Start to find someone
    </div>

    <div class="buttons">

        <button id="startBtn">
            🎥 Start Chat
        </button>

        <button id="muteBtn" disabled>
            🎤 Mute
        </button>

        <button id="cameraBtn" disabled>
            📷 Camera
        </button>

        <button id="skipBtn" disabled>
            ⏭ Next
        </button>

    </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="app.js"></script>

</body>
</html>
